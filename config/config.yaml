llm:
  provider: ollama
  base_url: http://localhost:11434
  default_model: llama3.1:8b
  embedding_model: nomic-embed-text
  temperature: 0.7
  timeout_s: 60.0
  models:
    embedding: nomic-embed-text
    local: llama3.1:8b
    small: llama3.2:1b
    coding: qwen2.5-coder:1.5b
    vision: llama3.2-vision:11b
    reasoning: llama3.1:8b
model_router:
  min_ram_gb: 8.0
  battery: true
  cloud_enabled: false
  strategy: local-first
ai:
  mode: local
  privacy: local_only
open_code:
  enabled: false
  base_url: http://127.0.0.1:4096
  timeout_s: 120.0
  default_model: ""
  models: {}
logging:
  level: INFO
  file: logs/nova.log
session:
  max_history_messages: 20
  system_prompt: >-
    Eres N.O.V.A. (Neural Operations & Virtual Assistant), tu asistente personal
    de IA que se ejecuta 100 % local. Sé conciso, preciso y útil.

    Reglas de idioma:
    - Responde SIEMPRE en el mismo idioma que el último mensaje del usuario
      (o el idioma de la conversación), aunque le describas una imagen, un
      archivo o una búsqueda web.
    - Si el usuario escribe en español, responde en español. Si cambia de idioma
      a mitad de la conversación, síguele el cambio.
permissions:
  autonomy: ask
  allow:
  - date_time
  - calculate
  deny: []
audit:
  file: logs/audit.nova.jsonl
memory:
  db_file: memory/nova.db
  session_id: default
  max_context: 3
  similarity_threshold: 0.3
api:
  # Loopback por defecto (seguro): la API solo responde en esta máquina.
  # Para exponerla a la LAN (0.0.0.0) o a otro host, configura también api.token,
  # porque N.O.V.A. se niega a arrancar en una interfaz no-loopback sin token.
  host: 127.0.0.1
  port: 8000
  cors_origins: ["*"]   # hosting estático (p. ej. Vercel) que conecta con ?api=<base>
host:
  apps:
    notepad: notepad.exe
  commands: []
  roots: []
  working_dir: null
  timeout_s: 30.0
web:
  enabled: false
  user_agent: NOVA/1.0 (N.O.V.A. local personal assistant)
  timeout_s: 12.0
  max_redirects: 5
  max_bytes: 1000000
  max_chars: 4000
  respect_robots: true
  min_delay_s: 1.0
  search_url: https://html.duckduckgo.com/html/?q={query}
  search_max: 5
voice:
  enabled: true
  stt:
    backend: vosk
    model_dir: C:\Users\Claudia-Everlasting\.nova\vosk\vosk-model-small-es-0.42
    language: es
  tts:
    backend: piper  # voz natural 100% local (descarga la voz ONNX la primera vez)
    voice: es_ES-davefx-medium
    rate: 180
    voice_dir: null   # ej: C:\Users\Claudia-Everlasting\.nova\voices
    auto_download: true
  wake_word: null
plugins:
  enabled:
  - text_tools
  - units
  dir: null
automation:
  enabled: false
  poll_s: 1.0
  tasks: []
  workflows: []
