llm:
  provider: ollama
  base_url: http://localhost:11434
  default_model: llama3.1:8b
  embedding_model: nomic-embed-text
  temperature: 0.7
  timeout_s: 60.0
  models:
    small: llama3.2:1b
    local: llama3.1:8b
    coding: qwen2.5-coder:7b
    vision: ''
    embedding: nomic-embed-text
model_router:
  min_ram_gb: 8.0
  battery: true
  cloud_enabled: false
logging:
  level: INFO
  file: logs/nova.log
session:
  max_history_messages: 20
  system_prompt: 'You are N.O.V.A. (Neural Operations & Virtual Assistant), a personal
    AI assistant running locally. Be concise, precise and helpful.

    '
permissions:
  autonomy: ask
  allow:
  - date_time
  - calculate
  deny: []
audit:
  file: logs/audit.nova.jsonl
memory:
  db_file: memory/nova.db
  session_id: default
  max_context: 3
  similarity_threshold: 0.3
api:
  host: 0.0.0.0
  port: 8000
host:
  apps:
    notepad: notepad.exe
  commands: []
  roots: []
  working_dir: null
  timeout_s: 30.0
web:
  enabled: false
  user_agent: NOVA/1.0 (N.O.V.A. local personal assistant)
  timeout_s: 12.0
  max_redirects: 5
  max_bytes: 1000000
  max_chars: 4000
  respect_robots: true
  min_delay_s: 1.0
  search_url: https://html.duckduckgo.com/html/?q={query}
  search_max: 5
voice:
  enabled: true
  stt:
    backend: vosk
    model_dir: C:\Users\Claudia-Everlasting\.nova\vosk\vosk-model-small-es-0.42
    language: es
  tts:
    backend: pyttsx3
    voice: null
    rate: 180
  wake_word: null
plugins:
  enabled:
  - text_tools
  - units
  dir: null
automation:
  enabled: false
  poll_s: 1.0
  tasks: []
  workflows: []
