[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nova"
version = "0.3.0"
description = "N.O.V.A. - Neural Operations & Virtual Assistant"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
]

[project.scripts]
nova = "nova.cli.chat:main"

[tool.setuptools.packages.find]
include = ["nova*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"