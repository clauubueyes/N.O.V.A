[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nova"
version = "0.13.0"
description = "N.O.V.A. - Neural Operations & Virtual Assistant"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "PyYAML>=6.0",
    "fastapi>=0.115",
    "uvicorn>=0.30",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
]
voice = [
    "numpy>=1.26",
    "vosk>=0.3.45",
    "pyttsx3>=2.95",
    "sounddevice>=0.4.6",
]

[project.scripts]
nova = "nova.cli.chat:main"
nova-setup = "nova.setup.cli:main"
nova-api = "nova.api.server:main"
nova-agent = "nova.desktop.agent:main"

[tool.setuptools.packages.find]
include = ["nova*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"